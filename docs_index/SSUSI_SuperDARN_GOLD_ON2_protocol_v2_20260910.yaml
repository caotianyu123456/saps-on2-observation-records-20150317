references:
  Ding2017:
    doi: 10.1002/2016JA023295
    use: SSUSI/GUVI auroral-boundary extraction; image boundary is not identical to SSJ b1e.
  Zhang2021:
    doi: 10.1029/2021JA029340
    use: SSUSI-constrained SuperDARN SAPS tracking; merged and inferred velocity distinction; 4-min processing.
  Kunduri2017:
    doi: 10.1002/2017JA024131
    use: SAPS statistics with explicit observation-opportunity denominator; historical UT restriction
      is not copied.
  Kunduri2018:
    doi: 10.1029/2018JA025690
    use: L-shell fitting, geometry support, LOS quality filters; distinguish inferred from measured vectors.
  He2017:
    doi: 10.1002/2017GL075449
    use: 250 m/s peak and electron-boundary criterion in a DMSP study; transfer to radar requires validation.
  Wang2012:
    doi: 10.1029/2012JA017656
    use: Physical motivation for hours-scale dynamics; 3-h imposed forcing is NOT a measured column-ON2
      response time.
  Correira2021:
    doi: 10.1029/2021JA029517
    use: GOLD column ratio retrieval, observational operator, uncertainty and contamination.
  Turnbull1976:
    doi: 10.1111/j.2517-6161.1976.tb01597.x
    use: Interval-censoring method; assess observation/censoring assumptions before inference.
  GOLD_Guide:
    url: https://gold.cs.ucf.edu/wp-content/documentation/GOLD_Public_Science_Data_Products_Guide_Rev5.2.pdf
    version: '5.2'
    use: ON2 fields, DQI, random/systematic/model uncertainty and spatial binning.
  GOLD_Notes:
    url: https://gold.cs.ucf.edu/wp-content/documentation/GOLD_Release_Notes_Rev5.11.pdf
    version: '5.11'
    use: Algorithm limits, contamination, cadence and instrument issues.
  GOLD_Issues:
    url: https://gold.cs.ucf.edu/wp-content/documentation/GOLD_Data_Issues_Table_Rev2.2.pdf
    version: '2.2'
    use: Date/UT-specific review masks; reconcile conservatively with detailed release notes.
  GOLD_Versions:
    url: https://gold.cs.ucf.edu/data/current-data-product-versions/
    checked: '2026-09-10'
    use: L2 ON2 v04r02 current at check time.
  SD_access:
    url: https://superdarn.ca/data-access
    use: FITACF and raw-data access; algorithms and hardware provenance.
