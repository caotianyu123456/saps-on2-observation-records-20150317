protocol_id: SSUSI_SuperDARN_GOLD_ON2_v2_20260910
status: proposed_for_outcome_blinded_validation_not_executed
replaces_for_new_branch: SAPS_GUVI_ON2_screening_v1_20260908
legacy_protocol_retained: true
critical_notes:
- This is an analysis specification and parameter template, NOT a functioning detector or a computed event
  catalogue.
- Published rules, official product constraints and project operating thresholds are separate.
- Validate operating thresholds using raw metadata, independent labels and coverage, blind to the ON2
  effect direction.
- Freeze a version before confirmatory statistics. Never optimize thresholds for a depletion or significant
  p value.
- Neither no radar echo nor lack of valid ON2 is a scientific non-response.
- SSUSI optical boundary and SSJ b1e are not interchangeable. Validate the target boundary definition.
