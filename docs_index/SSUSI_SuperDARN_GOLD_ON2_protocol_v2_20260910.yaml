outcomes:
  spatial_contrast: A(t)=mean_area(log(R_target))-sum(w_j*mean_area(log(R_control_j)))
  temporal_increment: D(t)=A(t)-median(A_pre)
  relative_increment: exp(D(t))-1
  primary_estimand: event-level paired relative increment at actual observed times in 0-3h; not a continuous-time
    average
  prespecified_lag_bins_h:
  - - 0
    - 1
  - - 1
    - 3
  - - 3
    - 6
  one_summary_per_local_event_per_lag_bin: true
  retain_preexisting_absolute_anomaly: true
  search_window_h:
  - -3
  - 6
  extend_if_long_episode: through observed end+3h, labelled as secondary
  whole_event_future_peak_used_as_causal_predictor: false
  optional_velocity_exposure: integral(Vw^2 dt) over observed prior intervals, with coverage; kinematic
    exposure only, NOT Joule heating
classification:
  preexisting_flag:
  - 'yes'
  - 'no'
  - unknown
  time_class:
  - early_0_1h
  - lagged_1_3h
  - late_3_6h
  - coexistence_only
  - interval_ambiguous
  - no_resolved_transition
  direction:
  - depletion
  - enhancement
  - bounded_within_equivalence_margin
  - uncertain
  equivalence_margin_fraction: 0.1
  confidence_level: 0.95
  depletion_rule: upper confidence bound of relative increment < -0.10
  enhancement_rule: lower confidence bound > +0.10
  near_zero_rule: entire confidence interval within [-0.10,+0.10]
  not_significant_equals_no_response: false
  first_detectable_transition_is_physical_onset: false
  two_native_scan_confirmation: for confirmed transition if follow-up exists; one-scan detections retained
    as provisional
  multiple_scan_false_alarms: calibrate with placebo onsets / simultaneous bands; do not use min value
    as primary endpoint
  lag_interval: '[response_left-onset_right,response_right-onset_left]'
  time_bin_only_if_full_interval_contained: true
  baseline_response_day_end_handling: left/right/interval censoring stored explicitly; missing late day
    is not recovery
  persistence:
  - during_flow
  - persists_after_end
  - recovered
  - right_censored_or_unknown
statistics:
  population: observable northern North-American dayglow SAPS, conditional on coverage and QC
  report_counts:
  - coverage_cell_time
  - parent_SAPS_tracks
  - local_episodes
  - paired_episodes
  - controlled_episodes
  - spatial_profiles
  - timing_episodes
  - independent_storms
  spatial_and_timing_cohorts_are_not_necessarily_nested: true
  main_cluster: storm_id; quiet branch uses linked episode/day blocks
  bootstrap_replicates: 2000
  main_event_weight: equal event contribution within each lag bin
  robustness:
  - equal_storm_weight
  - leave_one_storm_out
  - actual_cadence_strata
  - degrade_high_cadence_to_low_cadence_sampling_phases
  interval_censoring_method: optional Turnbull after checking observation/censoring assumptions; otherwise
