  unknown_precision_category_kept_in_detectable_response_denominator: true
  unconditional_physical_response_fraction_from_selected_sample: false
  many_speed_lag_subgroup_tests: exploratory with multiplicity accounting
  primary_continuous_effect_not_only_class_counts: true
pilot_and_release:
