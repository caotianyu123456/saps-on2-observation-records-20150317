  - missing_boundary_not_empirical_pass
  - one_GOLD_pixel_not_three
  - lag_interval_crossing_1h_not_forced
  - day_end_not_recovery
  - same_scan_duplicate_not_independent
  freeze_before_confirmatory_outcomes: true
  status_counts_not_predicted: true
  release_by_evidence_not_significance: true
