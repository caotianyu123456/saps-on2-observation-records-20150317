  observed_vs_interpolated_vs_model_only_separate: true
  model_only_in_primary: false
  fill_missing_sector_with_ellipse_as_observation: false
  unknown_uncertainty_policy: candidate only; no fabricated constant uncertainty
  boundary_validity_rechecked_at_radar_onset_and_each_gold_scan: true
